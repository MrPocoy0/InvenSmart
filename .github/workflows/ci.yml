name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (SQLite in memory)
        env:
          FLASK_ENV: testing
        run: python -m pytest -q
      - name: Ruff
        run: ruff check app tests --select E9
      - name: Check diff formatting
        run: git diff --check
